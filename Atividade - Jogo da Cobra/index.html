<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="jogo">
        <h1>🐍 Jogo da Cobra</h1>

        <div class="placar">
            <span>Pontos: <strong id="pontos">0</strong></span>
            <span>Recorde: <strong id="recorde">0</strong></span>
        </div>

        <canvas id="tela" width="400" height="400"></canvas>

        <p id="mensagem">Pressione ESPAÇO para começar</p>

        <button id="botao">Iniciar</button>

        <p class="ajuda">Use as setas (ou W A S D) para mover. ESPAÇO pausa o jogo.</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
